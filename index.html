<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ACtrack</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#0b0d10">
<style>
:root{
  --bg:#f2f2f5;--panel:rgba(255,255,255,.72);--card:#fff;--ink:#111317;--ink2:#5d6572;--ink3:#9aa2ae;--line:rgba(17,19,23,.08);
  --accent:#ff6b1a;--accent-soft:rgba(255,107,26,.12);--bar:#d9dde3;--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 28px rgba(0,0,0,.06);
  --r:22px;--ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#08090b;--panel:rgba(22,24,28,.72);--card:#14161a;--ink:#f3f4f6;--ink2:#a0a8b4;--ink3:#626a76;--line:rgba(255,255,255,.08);
  --accent:#ff8a3d;--accent-soft:rgba(255,138,61,.16);--bar:#2a2f37;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 34px rgba(0,0,0,.35)}}
:root[data-theme=dark]{--bg:#08090b;--panel:rgba(22,24,28,.72);--card:#14161a;--ink:#f3f4f6;--ink2:#a0a8b4;--ink3:#626a76;--line:rgba(255,255,255,.08);--accent:#ff8a3d;--accent-soft:rgba(255,138,61,.16);--bar:#2a2f37;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 34px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;padding:28px 14px;background:var(--panel);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;letter-spacing:-.02em;padding:0 12px 22px}
.brand i{width:28px;height:28px;border-radius:8px;background:linear-gradient(145deg,#ff9a4d,#ff5a00);display:grid;place-items:center;box-shadow:0 4px 12px rgba(255,90,0,.35)}
.brand svg{width:16px;height:16px;fill:#fff}
.nav{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:11px;border:0;background:none;color:var(--ink2);font-weight:550;cursor:pointer;text-align:left;transition:background .2s,color .2s}
.nav:hover{background:var(--line)}.nav.on{background:var(--accent-soft);color:var(--accent)}
.nav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav kbd{margin-left:auto;font:11px ui-monospace,monospace;color:var(--ink3)}
.side-foot{margin-top:auto;padding:12px;font-size:12px;color:var(--ink3);display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink3)}.dot.ok{background:#34c759}.dot.bad{background:#ff453a}
main{padding:34px clamp(18px,4vw,48px) 60px;max-width:1180px;width:100%}
h1{font-size:34px;letter-spacing:-.03em;margin:0 0 4px;font-weight:700}
.sub{color:var(--ink2);margin-bottom:26px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(12,1fr)}
.card{background:var(--card);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);border:1px solid var(--line)}
.anim .card{animation:rise .5s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c7{grid-column:span 7}.c8{grid-column:span 8}.c6{grid-column:span 6}.c12{grid-column:span 12}
.lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.big{font-size:52px;font-weight:700;letter-spacing:-.04em;line-height:1}.big small{font-size:18px;color:var(--ink2);font-weight:600;letter-spacing:0;margin-left:4px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.mut{color:var(--ink2)}.faint{color:var(--ink3);font-size:13px}
.seg{display:inline-flex;background:var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 15px;border-radius:9px;font-weight:600;font-size:14px;color:var(--ink2);cursor:pointer;transition:all .2s var(--ease)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.btn{border:0;border-radius:12px;background:var(--accent);color:#fff;padding:10px 18px;font-weight:650;cursor:pointer;transition:transform .15s var(--ease),filter .2s}
.btn:hover{filter:brightness(1.07)}.btn:active{transform:scale(.97)}.btn.ghost{background:var(--line);color:var(--ink)}.btn.sm{padding:6px 12px;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 11px;font-size:12px;font-weight:650;background:var(--line);color:var(--ink2)}
.pill.on{background:var(--accent-soft);color:var(--accent)}.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.dial{position:relative;width:min(260px,100%);margin:0 auto}.dial svg{width:100%;display:block}
.dial .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.dial .t{font-size:58px;font-weight:700;letter-spacing:-.045em;line-height:1}.dial .t sup{font-size:22px;vertical-align:top;position:relative;top:6px}
.step{display:flex;justify-content:center;gap:14px;margin-top:6px}
.step button{width:44px;height:44px;border-radius:50%;border:0;background:var(--line);font-size:22px;cursor:pointer;transition:transform .15s var(--ease),background .2s}
.step button:hover{background:var(--accent-soft)}.step button:active{transform:scale(.9)}
.chart{position:relative;user-select:none}.chart svg{width:100%;display:block;overflow:visible}
.chart text{fill:var(--ink3);font-size:11px}
#pc text{font-size:13px}
.tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:12px;padding:8px 12px;font-size:13px;white-space:nowrap;transform:translate(-50%,-100%);opacity:0;transition:opacity .12s}
.tip b{font-size:16px}
.legend{display:flex;gap:16px;margin-top:10px;font-size:13px;color:var(--ink2)}.legend span{display:flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:3px}
.field{margin-top:18px}.field label{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin-bottom:8px;font-weight:550}.field label b{color:var(--ink)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:99px;background:var(--line);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35);cursor:pointer;border:0}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35);border:0}
input[type=text],input[type=password],input[type=time],select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:10px 12px;outline:none}
input:focus,select:focus{border-color:var(--accent)}
.switch{position:relative;width:46px;height:28px;border-radius:99px;background:var(--line);border:0;cursor:pointer;transition:background .25s;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:transform .25s var(--ease)}
.switch.on{background:#34c759}.switch.on::after{transform:translateX(18px)}
.days{display:flex;gap:6px}.days button{flex:1;border:0;background:var(--line);border-radius:10px;padding:8px 0;font-size:12px;font-weight:650;color:var(--ink2);cursor:pointer;transition:all .2s}
.days button.on{background:var(--accent);color:#fff}
.win{background:var(--bg);border-radius:16px;padding:14px;margin-top:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}th,td{padding:9px 6px;text-align:right;border-bottom:1px solid var(--line)}th:first-child,td:first-child{text-align:left}th{font-size:12px;color:var(--ink3);font-weight:600}
.toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:99px;font-weight:550;font-size:14px;opacity:0;transition:all .3s var(--ease);z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}
.skel{height:140px;border-radius:14px;background:linear-gradient(90deg,var(--line),transparent,var(--line));background-size:200% 100%;animation:sh 1.4s infinite}@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;padding:40px 10px;color:var(--ink2)}
.tabbar{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}aside{display:none}main{padding:22px 16px 110px}h1{font-size:28px}
  .c4,.c5,.c7,.c8,.c6{grid-column:span 12}
  .tabbar{display:flex;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));background:var(--panel);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);border:1px solid var(--line);border-radius:22px;padding:6px;z-index:10;box-shadow:var(--shadow)}
  .tabbar button{flex:1;border:0;background:none;padding:9px 0;border-radius:16px;color:var(--ink2);font-size:11px;font-weight:600;display:grid;gap:3px;justify-items:center}.tabbar button.on{color:var(--accent);background:var(--accent-soft)}
  .tabbar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
}
body.widget .app{display:block}body.widget aside,body.widget .tabbar{display:none}body.widget main{padding:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside id="side"></aside>
  <main id="main"></main>
</div>
<nav class="tabbar" id="tabbar"></nav>
<div class="toast" id="toast"></div>
<script>
/* ---------- helpers ---------- */
const qTab=new URLSearchParams(location.search).get('tab');
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const $=s=>document.querySelector(s);
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const ICON={
  today:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>',
  spend:'<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  sched:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>',
  settings:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>'};
const TABS=[['today','Overview'],['spend','Spending'],['sched','Schedule'],['settings','Settings']];
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2600)};
const eur=e=>(e||0).toFixed(2).replace('.',',')+' €';
const cents=c=>c.toFixed(1).replace('.',',');
const dayKey=(d=new Date())=>d.toLocaleDateString('sv',{timeZone:'Europe/Helsinki'});
const hh=d=>d.toLocaleTimeString('fi',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Helsinki'});
const widget=new URLSearchParams(location.search).has('widget');
if(widget)document.body.classList.add('widget');
const theme=ls.get('theme');if(theme)document.documentElement.dataset.theme=theme;

/* ---------- backends: local homelab server, or GitHub ---------- */
const S={mode:null,base:ls.get('server')||'',srvTok:ls.get('srvtok')||'',repo:ls.get('repo')||'',ghTok:ls.get('token')||'',
  animate:true,cfg:null,state:null,sha:null,tab:qTab||ls.get('tab')||'today',range:+(ls.get('range')||14),err:'',loading:true,online:false,dirty:false,tableView:false};
const b64d=b=>JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\n/g,'')),c=>c.charCodeAt(0))));
const b64e=o=>{let s='';new TextEncoder().encode(JSON.stringify(o,null,2)+'\n').forEach(c=>s+=String.fromCharCode(c));return btoa(s)};
async function srv(path,opt={}){
  const r=await fetch((S.base||'')+'/api/'+path,{...opt,headers:{'Content-Type':'application/json',...(S.srvTok?{Authorization:'Bearer '+S.srvTok}:{}),...(opt.headers||{})},cache:'no-store'});
  if(!r.ok)throw new Error(r.status===401?'Wrong server password':'Server '+r.status);return r.json();
}
async function gh(path,opt={}){
  const r=await fetch(`https://api.github.com/repos/${S.repo}/contents/${path}`,{...opt,headers:{Authorization:'Bearer '+S.ghTok,Accept:'application/vnd.github+json',...(opt.headers||{})},cache:'no-store'});
  if(!r.ok)throw new Error(r.status===404||r.status===401?'GitHub: check repo and token':'GitHub '+r.status);return r.json();
}
async function detect(){
  if(location.protocol.startsWith('http')){try{await srv('state');S.mode='server';return}catch(e){if(S.base||/Wrong/.test(e.message)){S.mode='server';throw e}}}
  if(S.repo&&S.ghTok)S.mode='github';else S.mode=null;
}
async function load(quiet){
  try{
    if(!S.mode)await detect();
    if(S.mode==='server'){S.state=await srv('state');S.cfg=await srv('config')}
    else if(S.mode==='github'){const c=await gh('config.json');S.cfg=b64d(c.content);S.sha=c.sha;try{S.state=b64d((await gh('data/state.json')).content)}catch(e){S.state=null}}
    S.err='';S.online=!!S.mode;
  }catch(e){S.err=e.message;S.online=false;if(!/Wrong|GitHub:/.test(e.message))S.mode=null}
  S.loading=false;if(!quiet||!isEditing())render();
}
const isEditing=()=>document.activeElement&&/INPUT|SELECT/.test(document.activeElement.tagName);
async function saveCfg(msg){
  try{
    if(S.mode==='server')await srv('config',{method:'PUT',body:JSON.stringify(S.cfg)});
    else{const r=await gh('config.json',{method:'PUT',body:JSON.stringify({message:'config from ACtrack',content:b64e(S.cfg),sha:S.sha})});S.sha=r.content.sha}
    S.dirty=false;toast(msg||(S.mode==='server'?'Saved':'Saved — applies within a few minutes'));
  }catch(e){toast('Save failed: '+e.message)}
}
async function control(id,mode,target,minutes){
  const u=S.cfg.units[id];
  try{
    if(S.mode==='server'){S.state=await srv('control',{method:'POST',body:JSON.stringify({id,mode,target,minutes})});S.cfg=await srv('config')}
    else{
      if(mode==='auto')delete u.override;
      else u.override={mode,until:new Date(Date.now()+minutes*60e3).toISOString(),...(target?{target}:{})};
      await saveCfg('Sent — the scheduler picks it up in a few minutes');
    }
    render();
  }catch(e){toast('Failed: '+e.message)}
}

/* ---------- data ---------- */
const prices=()=>(S.state?.plan?.prices||[]).map(p=>({t:new Date(p.t),c:p.c}));
const nowIdx=ps=>{const n=Date.now();return ps.findIndex(p=>n>=p.t&&n<p.t.getTime()+3600e3)};
const devs=()=>Object.entries(S.state?.devices||{});
const heatSet=()=>{const s=new Set();devs().forEach(([,d])=>(d.plan||[]).forEach(p=>p.heat&&s.add(new Date(p.t).getTime())));return s};

/* ---------- charts ---------- */
function priceChart(ps,heat,id){
  if(!ps.length)return '<div class="empty">No price data yet</div>';
  const W=620,H=250,pad=4,bw=(W-pad*2)/ps.length,mx=Math.max(...ps.map(p=>p.c))*1.08,ni=nowIdx(ps);
  let s=`<svg viewBox="0 0 ${W} ${H+24}" role="img" aria-label="Price per hour">`;
  [0.5,1].forEach(f=>s+=`<line x1="0" x2="${W}" y1="${H-H*f/1.08}" y2="${H-H*f/1.08}" stroke="var(--line)"/>`);
  ps.forEach((p,i)=>{const h=Math.max(4,p.c/mx*H),x=pad+i*bw,hot=heat.has(p.t.getTime());
    s+=`<rect data-i="${i}" x="${x+1.5}" y="${H-h}" width="${Math.max(2,bw-3)}" height="${h}" rx="3" fill="${hot?'var(--accent)':'var(--bar)'}" opacity="${p.t.getTime()<Date.now()-3600e3?.55:1}"/>`;
    if(p.t.getHours()%6===0)s+=`<text x="${x+bw/2}" y="${H+18}" text-anchor="middle">${String(p.t.getHours()).padStart(2,'0')}</text>`;
    if(p.t.getHours()===0&&i)s+=`<line x1="${x}" x2="${x}" y1="0" y2="${H}" stroke="var(--line)" stroke-dasharray="3 4"/>`});
  if(ni>=0){const x=pad+ni*bw+bw/2;s+=`<line x1="${x}" x2="${x}" y1="0" y2="${H}" stroke="var(--ink)" stroke-width="1.5"/><circle cx="${x}" cy="4" r="4" fill="var(--ink)"/>`}
  return `<div class="chart" id="${id}">${s}<rect id="${id}-hit" x="0" y="0" width="${W}" height="${H}" fill="transparent"/></svg><div class="tip"></div></div>`;
}
function wirePriceChart(id,ps,heat){
  const el=$('#'+id);if(!el)return;const tip=el.querySelector('.tip'),svg=el.querySelector('svg');
  el.addEventListener('pointermove',e=>{const r=svg.getBoundingClientRect(),i=Math.min(ps.length-1,Math.max(0,Math.floor((e.clientX-r.left)/r.width*ps.length))),p=ps[i];
    tip.innerHTML=`<div class="faint">${p.t.toLocaleDateString('en',{weekday:'short',timeZone:'Europe/Helsinki'})} ${hh(p.t)}</div><b>${cents(p.c)} c</b><span class="faint"> /kWh${heat.has(p.t.getTime())?' · heating':''}</span>`;
    tip.style.left=Math.min(r.width-70,Math.max(70,i/ps.length*r.width+r.width/ps.length/2))+'px';tip.style.top=(e.clientY-r.top-18)+'px';tip.style.opacity=1});
  el.addEventListener('pointerleave',()=>tip.style.opacity=0);
}
function dial(room,target,on){
  const R=100,C=2*Math.PI*R,arc=C*0.75,lo=16,hi=28,f=v=>Math.max(0,Math.min(1,(v-lo)/(hi-lo)));
  const ang=v=>135+270*f(v),pt=(a,r)=>[110+r*Math.cos(a*Math.PI/180),110+r*Math.sin(a*Math.PI/180)];
  const [tx,ty]=pt(ang(target),R);
  return `<div class="dial"><svg viewBox="0 0 220 220"><g transform="rotate(135 110 110)"><circle cx="110" cy="110" r="${R}" fill="none" stroke="var(--line)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${arc} ${C}"/>
  <circle cx="110" cy="110" r="${R}" fill="none" stroke="${on?'var(--accent)':'var(--ink3)'}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${arc*f(room||lo)} ${C}" style="transition:stroke-dasharray .8s var(--ease)"/></g>
  <circle cx="${tx}" cy="${ty}" r="9" fill="var(--card)" stroke="var(--ink)" stroke-width="3"/></svg>
  <div class="mid"><div class="lbl" style="margin:0">Room</div><div class="t">${room!=null?Math.round(room*10)/10:'–'}<sup>°</sup></div><div class="faint">target ${target}°</div></div></div>`;
}

/* ---------- views ---------- */
function connectCard(){return `<div class="card c12" style="max-width:560px"><div class="lbl">Get started</div><h2 style="margin:0 0 6px;font-size:22px">Connect ACtrack</h2><p class="mut">Open Settings and connect your homelab server or your GitHub repo.</p><button class="btn" data-go="settings">Open settings</button></div>`}
function viewToday(){
  if(!S.online&&!S.state)return `<h1>Overview</h1><div class="sub">${S.err||'Not connected yet'}</div><div class="grid">${connectCard()}</div>`;
  const ps=prices(),ni=nowIdx(ps),cur=ni>=0?ps[ni].c:null,heat=heatSet(),d=devs();
  const todayEur=d.reduce((a,[,x])=>a+(x.days?.[dayKey()]?.eur||0),0),todayKwh=d.reduce((a,[,x])=>a+(x.days?.[dayKey()]?.kwh||0),0);
  const next=ps.slice(ni+1).find(p=>heat.has(p.t.getTime())!==heat.has(ps[ni]?.t.getTime()));
  let h=`<h1>${new Date().getHours()<12?'Good morning':new Date().getHours()<18?'Good afternoon':'Good evening'}</h1><div class="sub">${S.state?.updated?'Updated '+hh(new Date(S.state.updated)):'Waiting for first run'} · spot price + estimated margin &amp; transfer</div><div class="grid">`;
  if(!d.length)h+=`<div class="card c12 empty">No AC tracked yet. Add one in <a href="#" data-go="sched" style="color:var(--accent)">Schedule</a>.</div>`;
  d.forEach(([id,x],k)=>{const day=x.days?.[dayKey()]||{kwh:0,eur:0},ov=x.override;
    h+=`<div class="card c5" style="animation-delay:${k*60}ms"><div class="row"><b style="font-size:17px">${x.name||id}</b><span class="pill ${x.on?'on':''}"><i></i>${ov?'Manual · ':''}${x.on?'Heating':'Idle'}</span></div>
    ${dial(x.room_temp,x.target,x.on)}
    <div class="step"><button data-t="-0.5" data-id="${id}" aria-label="Cooler">−</button><button data-t="0.5" data-id="${id}" aria-label="Warmer">+</button></div>
    <div class="row" style="margin-top:18px"><div class="seg" data-ctl="${id}"><button class="${!ov?'on':''}" data-m="auto">Auto</button><button data-m="on" data-min="60">Boost 1 h</button><button class="${ov&&ov.mode==='off'?'on':''}" data-m="off" data-min="120">Off 2 h</button></div></div>
    <div class="faint" style="margin-top:12px">Outside ${x.outside_temp??'–'}° · today ${eur(day.eur)} · ${day.kwh.toFixed(1)} kWh</div></div>`});
  h+=`<div class="card c7" style="animation-delay:80ms"><div class="row"><div><div class="lbl">Price now</div><div class="big">${cur==null?'–':cents(cur)}<small>c/kWh</small></div></div><div style="text-align:right"><div class="lbl">Spent today</div><div class="big" style="font-size:34px">${eur(todayEur)}</div><div class="faint">${todayKwh.toFixed(1)} kWh</div></div></div>
  <div style="margin-top:22px">${priceChart(ps,heat,'pc')}</div><div class="legend"><span><i style="background:var(--accent)"></i>Heating</span><span><i style="background:var(--bar)"></i>Off</span>${next?`<span style="margin-left:auto">${heat.has(ps[ni]?.t.getTime())?'Heating until':'Next heating'} ${hh(next.t)}</span>`:''}</div></div></div>`;
  return h;
}
function viewSpend(){
  const d=devs();if(!d.length)return '<h1>Spending</h1><div class="sub">Nothing tracked yet</div>';
  const byDay={};d.forEach(([,x])=>Object.entries(x.days||{}).forEach(([k,v])=>{(byDay[k]??={eur:0,kwh:0});byDay[k].eur+=v.eur;byDay[k].kwh+=v.kwh}));
  const keys=Object.keys(byDay).sort().slice(-S.range),tot=keys.reduce((a,k)=>a+byDay[k].eur,0),kwh=keys.reduce((a,k)=>a+byDay[k].kwh,0);
  const byHour=Array(24).fill(0);d.forEach(([,x])=>keys.forEach(k=>Object.entries(x.days?.[k]?.hours||{}).forEach(([h,v])=>byHour[+h]+=v.eur)));
  let h=`<div class="row"><div><h1>Spending</h1><div class="sub">Measured kWh × hourly price</div></div><div class="seg" id="range">${[7,14,30].map(n=>`<button class="${S.range===n?'on':''}" data-r="${n}">${n} d</button>`).join('')}</div></div><div class="grid">
  <div class="card c4"><div class="lbl">Total</div><div class="big">${eur(tot)}</div><div class="faint">${kwh.toFixed(1)} kWh · ${keys.length?eur(tot/keys.length):'–'} per day · ${kwh?cents(tot/kwh*100):'–'} c/kWh avg</div></div>
  <div class="card c8"><div class="row"><div class="lbl">Per day</div><div class="seg"><button class="${!S.tableView?'on':''}" data-tv="0">Chart</button><button class="${S.tableView?'on':''}" data-tv="1">Table</button></div></div>`;
  if(S.tableView)h+=`<table><tr><th>Day</th><th>kWh</th><th>Cost</th></tr>${keys.slice().reverse().map(k=>`<tr><td>${k}</td><td>${byDay[k].kwh.toFixed(1)}</td><td>${eur(byDay[k].eur)}</td></tr>`).join('')}</table>`;
  else{const W=700,H=150,mx=Math.max(.01,...keys.map(k=>byDay[k].eur))*1.1,bw=W/Math.max(keys.length,1);
    h+=`<div class="chart" id="sc"><svg viewBox="0 0 ${W} ${H+22}" preserveAspectRatio="none">`+keys.map((k,i)=>{const v=byDay[k].eur,hgt=Math.max(3,v/mx*H);return `<rect data-k="${k}" x="${i*bw+bw*.18}" y="${H-hgt}" width="${bw*.64}" height="${hgt}" rx="5" fill="var(--accent)"/><text x="${i*bw+bw/2}" y="${H+16}" text-anchor="middle">${keys.length>16&&i%2?'':k.slice(8)}</text>`}).join('')+`</svg><div class="tip"></div></div>`}
  h+=`</div><div class="card c12"><div class="lbl">When the money goes (by hour of day)</div>${hourBars(byHour)}</div>`;
  d.forEach(([id,x])=>{const e=keys.reduce((a,k)=>a+(x.days?.[k]?.eur||0),0),w=keys.reduce((a,k)=>a+(x.days?.[k]?.kwh||0),0);h+=`<div class="card c6"><div class="lbl">${x.name||id}</div><div class="big" style="font-size:36px">${eur(e)}</div><div class="faint">${w.toFixed(1)} kWh</div></div>`});
  return h+'</div><p class="faint" style="margin-top:18px">Panasonic reports energy with a delay, so figures are approximate.</p>';
}
function hourBars(v){const mx=Math.max(.001,...v),W=700,H=70;return `<div class="chart"><svg viewBox="0 0 ${W} ${H+20}" preserveAspectRatio="none">`+v.map((x,i)=>`<rect x="${i*W/24+3}" y="${H-Math.max(2,x/mx*H)}" width="${W/24-6}" height="${Math.max(2,x/mx*H)}" rx="3" fill="${x?'var(--accent)':'var(--bar)'}"><title>${String(i).padStart(2,'0')}:00 — ${eur(x)}</title></rect>${i%3===0?`<text x="${i*W/24+W/48}" y="${H+15}" text-anchor="middle">${String(i).padStart(2,'0')}</text>`:''}`).join('')+'</svg></div>'}
const hourSel=(v,k,e)=>`<select data-k="${k}" aria-label="${k}">${Array.from({length:24+e},(_,i)=>{const t=String(i).padStart(2,'0')+':00';return `<option ${t===v?'selected':''}>${t}</option>`}).join('')}</select>`;
function viewSched(){
  if(!S.cfg)return `<h1>Schedule</h1><div class="grid">${connectCard()}</div>`;
  let h=`<div class="row"><div><h1>Schedule</h1><div class="sub">Tell it when you want warmth. It picks the cheapest hours inside.</div></div><button class="btn" id="save" style="${S.dirty?'':'opacity:.5'}">Save</button></div><div class="grid">`;
  Object.entries(S.cfg.units).forEach(([id,u])=>{
    const nm=S.state?.devices?.[id]?.name||S.state?.available?.find(a=>a.id===id)?.name||id;
    h+=`<div class="card c6" data-u="${id}"><div class="row"><b style="font-size:17px">${nm}</b><button class="switch ${u.enabled!==false?'on':''}" data-k="enabled" aria-label="Enabled"></button></div>
    <div class="field"><label>Target temperature <b>${u.target??21}°</b></label><input type="range" min="16" max="26" step="0.5" value="${u.target??21}" data-k="target"></div>
    <div class="field"><label>Savings ⟷ comfort <b>${Math.round((u.comfort??.7)*100)}%</b></label><input type="range" min="0.2" max="1" step="0.05" value="${u.comfort??.7}" data-k="comfort"></div>
    <div class="field"><label>Never heat above <b>${u.max_price??40} c/kWh</b></label><input type="range" min="5" max="80" step="1" value="${u.max_price??40}" data-k="max_price"></div>
    <div class="field"><label>Warm during</label>${(u.windows||[]).map((w,i)=>`<div class="win" data-w="${i}"><div class="days">${DAYS.map((n,j)=>`<button class="${w.days.includes(j)?'on':''}" data-d="${j}">${n}</button>`).join('')}</div><div class="two">${hourSel(w.start,'start',0)}${hourSel(w.end,'end',1)}</div><button class="btn ghost sm" style="margin-top:10px" data-rm="${i}">Remove</button></div>`).join('')}
    <button class="btn ghost sm" style="margin-top:12px" data-addw>+ Add window</button></div>
    <button class="btn ghost sm" style="margin-top:18px" data-delu>Stop tracking</button></div>`});
  const free=(S.state?.available||[]).filter(a=>!S.cfg.units[a.id]);
  h+=free.length?`<div class="card c6"><div class="lbl">Add an AC</div>${free.map(a=>`<div class="row" style="margin-top:10px"><span>${a.name}</span><button class="btn sm" data-add="${a.id}">Add</button></div>`).join('')}</div>`:'';
  return h+'</div>';
}
function viewSettings(){
  return `<h1>Settings</h1><div class="sub">Where ACtrack gets its data.</div><div class="grid">
  <div class="card c6"><div class="row"><div class="lbl">Homelab server</div><span class="pill ${S.mode==='server'&&S.online?'on':''}">${S.mode==='server'&&S.online?'Connected':'Optional'}</span></div>
  <p class="mut" style="margin-top:0">Instant control, no GitHub needed. Leave the address empty when this page is served by the server itself.</p>
  <div class="field"><label>Server address</label><input type="text" id="srv" value="${S.base}" placeholder="http://homelab:8787"></div><div class="field"><label>Server password</label><input type="password" id="srvtok" value="${S.srvTok}"></div></div>
  <div class="card c6"><div class="row"><div class="lbl">GitHub</div><span class="pill ${S.mode==='github'&&S.online?'on':''}">${S.mode==='github'&&S.online?'Connected':'Optional'}</span></div>
  <p class="mut" style="margin-top:0">Reads and writes your private repo. Use a fine-grained token with Contents: read &amp; write, for that repo only.</p>
  <div class="field"><label>Repository</label><input type="text" id="repo" value="${S.repo}" placeholder="owner/actrack"></div><div class="field"><label>Token</label><input type="password" id="ghtok" value="${S.ghTok}"></div></div>
  <div class="card c12"><div class="row"><div><b>Appearance</b><div class="faint">Follows your system by default</div></div><div class="seg" id="theme">${['auto','light','dark'].map(t=>`<button class="${(ls.get('theme')||'auto')===t?'on':''}" data-th="${t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div></div></div>
  <div class="row c12" style="grid-column:span 12"><span class="faint">${S.err||''}</span><button class="btn" id="conn">Connect</button></div></div>
  <p class="faint" style="margin-top:20px">Shortcuts: 1–4 switch views · R refreshes · add <code>?widget=1</code> to the URL for the compact widget.</p>`;
}
function viewWidget(){
  const ps=prices(),ni=nowIdx(ps),d=devs(),e=d.reduce((a,[,x])=>a+(x.days?.[dayKey()]?.eur||0),0);
  return `<div class="card" style="padding:18px"><div class="row"><div><div class="lbl">Price now</div><div class="big" style="font-size:38px">${ni>=0?cents(ps[ni].c):'–'}<small>c</small></div></div><div style="text-align:right"><div class="lbl">Today</div><div class="big" style="font-size:30px">${eur(e)}</div></div></div>
  ${d.map(([,x])=>`<div class="row" style="margin-top:14px"><span>${x.name}<span class="faint"> · ${x.room_temp??'–'}°</span></span><span class="pill ${x.on?'on':''}"><i></i>${x.on?'Heating '+x.target+'°':'Idle'}</span></div>`).join('')}</div>`;
}

/* ---------- render + events ---------- */
function render(){
  const main=$('#main');
  $('#side').innerHTML=`<div class="brand"><i><svg viewBox="0 0 24 24"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-4.500 3-6.500 1 1.500 1.500 2 2 3 1-2.500 1-5 1-8.500z"/></svg></i>ACtrack</div>`+
    TABS.map(([k,n],i)=>`<button class="nav ${S.tab===k?'on':''}" data-go="${k}">${ICON[k]}${n}<kbd>${i+1}</kbd></button>`).join('')+
    `<div class="side-foot"><span class="dot ${S.online?'ok':'bad'}"></span>${S.online?(S.mode==='server'?'Homelab · live':'GitHub'):'Offline'}</div>`;
  $('#tabbar').innerHTML=TABS.map(([k,n])=>`<button class="${S.tab===k?'on':''}" data-go="${k}">${ICON[k]}${n}</button>`).join('');
  if(widget){main.innerHTML=S.state?viewWidget():'<div class="card empty">Open ACtrack and connect first</div>';return}
  if(S.loading){main.innerHTML='<h1>&nbsp;</h1><div class="grid"><div class="card c5"><div class="skel"></div></div><div class="card c7"><div class="skel"></div></div></div>';return}
  main.classList.toggle('anim',S.animate);S.animate=false;
  main.innerHTML=({today:viewToday,spend:viewSpend,sched:viewSched,settings:viewSettings}[S.tab]||viewToday)();
  if(S.tab==='today'){wirePriceChart('pc',prices(),heatSet())}
  if(S.tab==='spend'){const el=$('#sc');if(el){const tip=el.querySelector('.tip');el.querySelectorAll('rect').forEach(r=>{r.addEventListener('pointerenter',e=>{const k=r.dataset.k,by={eur:0,kwh:0};devs().forEach(([,x])=>{const v=x.days?.[k];if(v){by.eur+=v.eur;by.kwh+=v.kwh}});const b=el.getBoundingClientRect(),rb=r.getBoundingClientRect();tip.innerHTML=`<div class="faint">${k}</div><b>${eur(by.eur)}</b><span class="faint"> · ${by.kwh.toFixed(1)} kWh</span>`;tip.style.left=rb.left-b.left+rb.width/2+'px';tip.style.top=rb.top-b.top-8+'px';tip.style.opacity=1});r.addEventListener('pointerleave',()=>tip.style.opacity=0)})}}
}
const go=t=>{S.animate=true;S.tab=t;ls.set('tab',t);render();scrollTo(0,0)};
document.addEventListener('click',async e=>{
  const t=e.target.closest('button,a');if(!t)return;
  if(t.dataset.go){e.preventDefault();return go(t.dataset.go)}
  if(t.dataset.r){S.range=+t.dataset.r;ls.set('range',S.range);return render()}
  if(t.dataset.tv){S.tableView=t.dataset.tv==='1';return render()}
  if(t.dataset.th){const v=t.dataset.th;ls.set('theme',v==='auto'?'':v);if(v==='auto')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=v;return render()}
  if(t.id==='conn'){S.base=$('#srv').value.trim().replace(/\/$/,'');S.srvTok=$('#srvtok').value;S.repo=$('#repo').value.trim();S.ghTok=$('#ghtok').value.trim();
    ['server','srvtok','repo','token'].forEach((k,i)=>ls.set(k,[S.base,S.srvTok,S.repo,S.ghTok][i]));S.mode=null;S.loading=true;render();await load();if(S.online){toast('Connected');go('today')}return}
  if(t.id==='save')return saveCfg();
  const ctl=t.closest('[data-ctl]');if(ctl&&t.dataset.m)return control(ctl.dataset.ctl,t.dataset.m,t.dataset.m==='on'?S.cfg.units[ctl.dataset.ctl]?.target:undefined,+t.dataset.min||0);
  if(t.dataset.t){const id=t.dataset.id,u=S.cfg.units[id],x=S.state.devices[id],nt=Math.max(16,Math.min(28,(u.override?.target??u.target??21)+ +t.dataset.t));u.target=nt;x.target=nt;S.dirty=true;render();clearTimeout(go.d);go.d=setTimeout(async()=>{await saveCfg(S.mode==='server'?'Target '+nt+'°':undefined);if(S.mode==='server')control(id,'auto')},700);return}
  if(t.dataset.add){S.cfg.units[t.dataset.add]={enabled:true,target:21,comfort:.7,max_price:40,windows:[{days:[0,1,2,3,4,5,6],start:'06:00',end:'16:00'}]};S.dirty=true;return render()}
  const card=t.closest('[data-u]');if(!card)return;const u=S.cfg.units[card.dataset.u];
  if(t.dataset.d!==undefined){const w=u.windows[+t.closest('[data-w]').dataset.w],d=+t.dataset.d;w.days=w.days.includes(d)?w.days.filter(x=>x!==d):[...w.days,d].sort()}
  else if(t.dataset.rm!==undefined)u.windows.splice(+t.dataset.rm,1);
  else if(t.dataset.addw!==undefined)(u.windows=u.windows||[]).push({days:[0,1,2,3,4,5,6],start:'06:00',end:'12:00'});
  else if(t.dataset.delu!==undefined)delete S.cfg.units[card.dataset.u];
  else if(t.dataset.k==='enabled')u.enabled=u.enabled===false;
  else return;
  S.dirty=true;render();
});
document.addEventListener('change',e=>{if(e.target.tagName==='SELECT')e.target.dispatchEvent(new Event('input',{bubbles:true}))});
document.addEventListener('input',e=>{
  const t=e.target,card=t.closest('[data-u]');if(!card||!t.dataset.k)return;const u=S.cfg.units[card.dataset.u],w=t.closest('[data-w]'),k=t.dataset.k;
  if(w)u.windows[+w.dataset.w][k]=t.value;else u[k]=+t.value;S.dirty=true;$('#save')?.style.setProperty('opacity',1);
  const b=t.closest('.field')?.querySelector('label b');if(b)b.textContent=k==='target'?u[k]+'°':k==='comfort'?Math.round(u[k]*100)+'%':u[k]+' c/kWh';
});
document.addEventListener('keydown',e=>{if(/INPUT|SELECT/.test(e.target.tagName)||e.metaKey||e.ctrlKey)return;const i='1234'.indexOf(e.key);if(i>=0)go(TABS[i][0]);if(e.key==='r'){load();toast('Refreshing')}});
render();load();setInterval(()=>load(true),60e3);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
