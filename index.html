<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ACtrack</title>
<link rel="manifest" href="manifest.json?v=3">
<link rel="icon" type="image/svg+xml" href="icon.svg?v=3">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png?v=3">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<meta name="theme-color" content="#141a21">
<style>
@font-face{font-family:"Inter";font-weight:100 900;font-style:normal;font-display:swap;src:url(inter.woff2) format("woff2")}
:root{
  --bg:#f3f4f6;--surface:#fff;--ink:#14181f;--ink2:#566170;--ink3:#8792a0;--line:#e3e6ea;--line2:#cfd4db;
  --accent:#b45f06;--band:rgba(217,119,6,.16);--bar:#9aa9bc;--bar2:#3d4a5c;--ok:#2a9d5c;--bad:#d03a31;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0e1217;--surface:#141a21;--ink:#e6eaf0;--ink2:#98a3b1;--ink3:#66717f;--line:#212932;--line2:#2c3641;
  --accent:#f0a23b;--band:rgba(240,162,59,.15);--bar:#4f647f;--bar2:#9db0c8;--ok:#46c28a;--bad:#ff6b61}}
:root[data-theme=dark]{--bg:#0e1217;--surface:#141a21;--ink:#e6eaf0;--ink2:#98a3b1;--ink3:#66717f;--line:#212932;--line2:#2c3641;--accent:#f0a23b;--band:rgba(240,162,59,.15);--bar:#4f647f;--bar2:#9db0c8;--ok:#46c28a;--bad:#ff6b61}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif;font-feature-settings:"tnum","cv11","ss03";-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:208px minmax(0,1fr);min-height:100vh}
aside{position:sticky;top:0;height:100vh;padding:20px 12px;border-right:1px solid var(--line);display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:14px;padding:2px 10px 22px;letter-spacing:-.005em}
.brand img{width:22px;height:22px;border-radius:5px;display:block}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:6px;border:0;background:none;color:var(--ink2);font-weight:500;cursor:pointer;text-align:left}
.nav:hover{background:var(--line)}.nav.on{background:var(--line);color:var(--ink)}
.nav svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.side-foot{margin-top:auto;padding:10px;font-size:12px;color:var(--ink3);display:flex;gap:8px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink3);flex:none}.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}
main{padding:28px clamp(16px,4vw,44px) 64px;max-width:1080px;width:100%}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
h1{font-size:20px;font-weight:600;letter-spacing:-.015em;margin:0}.meta{color:var(--ink3);font-size:13px;margin-top:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:16px;overflow:hidden}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);min-height:46px;flex-wrap:wrap}
.ph b{font-weight:600}.pb{padding:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr)}
.stat{padding:14px 16px;border-right:1px solid var(--line)}.stat:last-child{border-right:0}
.k{font-size:12px;color:var(--ink3);margin-bottom:4px;font-weight:500}
.v{font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}.v small{font-size:13px;color:var(--ink2);font-weight:500;letter-spacing:0;margin-left:3px}
.sub{color:var(--ink3);font-size:12px;margin-top:2px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--ink2);white-space:nowrap}
.badge i{width:7px;height:7px;border-radius:50%;background:var(--ink3)}.badge.on{color:var(--accent)}.badge.on i{background:var(--accent)}
.tool{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.tool .grp{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:6px;padding:2px;gap:2px}
.seg button{border:0;background:none;padding:4px 12px;border-radius:4px;font-weight:500;font-size:13px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--ink)}.seg button.on{background:var(--ink);color:var(--bg)}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:6px;padding:6px 14px;font-weight:500;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line2)}.btn.ghost:hover{background:var(--line)}.btn.sm{padding:3px 10px;font-size:13px}.btn.dim{opacity:.45}
.stepper{display:inline-flex;align-items:center;gap:2px;margin-left:10px;vertical-align:3px}
.stepper button{width:24px;height:24px;border:1px solid var(--line2);background:none;border-radius:5px;cursor:pointer;color:var(--ink2);line-height:1;font-size:15px;padding:0}
.stepper button:hover{background:var(--line);color:var(--ink)}
.chart{position:relative;user-select:none}.chart svg{width:100%;display:block;overflow:visible}
.chart text{fill:var(--ink3);font-size:11px;font-family:inherit}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:6px;padding:6px 10px;font-size:12px;white-space:nowrap;transform:translate(-50%,-100%);opacity:0;transition:opacity .1s;z-index:3}
.tip b{font-weight:600}.tip .t2{opacity:.65}
.legend{display:flex;gap:16px;font-size:12px;color:var(--ink2);flex-wrap:wrap;align-items:center}.legend span{display:flex;align-items:center;gap:6px}.legend i{width:9px;height:9px;border-radius:2px}
.plan{font-size:13px;color:var(--ink2);margin-top:12px}.plan b{color:var(--ink);font-weight:500}
table{width:100%;border-collapse:collapse}th,td{padding:9px 16px;text-align:right;border-bottom:1px solid var(--line)}tr:last-child td{border-bottom:0}th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--ink3);font-weight:500}td.best{color:var(--ink);font-weight:600}td.best::after{content:' lowest';color:var(--accent);font-size:11px;font-weight:500;margin-left:6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 16px;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}
.row .l{min-width:0}.row .l b{font-weight:500;display:block}.row .l span{color:var(--ink3);font-size:12px}
.row .c{display:flex;align-items:center;gap:12px;flex:none;width:min(260px,52%)}.row .c output{min-width:62px;text-align:right;font-weight:500}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;outline:none;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:var(--line2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-6.5px;border-radius:50%;background:var(--ink);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line2);cursor:pointer}
input[type=range]::-moz-range-track{height:3px;border-radius:3px;background:var(--line2)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--ink);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line2)}
input[type=text],input[type=password],select{width:100%;background:var(--surface);border:1px solid var(--line2);border-radius:6px;padding:7px 10px;outline:none}
input:focus,select:focus{border-color:var(--ink2)}
.tool select{width:auto;padding:4px 8px;font-size:13px}
.switch{position:relative;width:34px;height:20px;border-radius:99px;background:var(--line2);border:0;cursor:pointer;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.switch.on{background:var(--ink)}.switch.on::after{transform:translateX(14px);background:var(--bg)}
.days{display:flex;gap:4px}.days button{flex:1;border:1px solid var(--line2);background:none;border-radius:5px;padding:4px 0;font-size:12px;font-weight:500;color:var(--ink2);cursor:pointer}
.days button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.win{padding:12px 16px;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto auto auto auto;gap:10px;align-items:center}
.win select{width:auto}.win .arrow{color:var(--ink3)}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,12px);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-weight:500;font-size:13px;opacity:0;transition:all .2s;z-index:20;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
.empty{padding:36px 16px;text-align:center;color:var(--ink2)}.empty a{color:var(--accent)}
.err{color:var(--bad);font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid2 .panel{margin:0}
.tabbar{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}aside{display:none}main{padding:18px 14px 96px}
  .stats{grid-template-columns:1fr 1fr}.stat:nth-child(2){border-right:0}.stat:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .grid2{grid-template-columns:1fr}.row{flex-wrap:wrap}.row .c{width:100%}
  .win{grid-template-columns:1fr 1fr}.win .days{grid-column:1/-1}.win .arrow{display:none}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:10}
  .tabbar button{flex:1;border:0;background:none;padding:6px 0;color:var(--ink3);font-size:11px;font-weight:500;display:grid;gap:3px;justify-items:center}.tabbar button.on{color:var(--ink)}
  .tabbar svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
}
body.widget .app{display:block}body.widget aside,body.widget .tabbar{display:none}body.widget main{padding:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside id="side"></aside>
  <main id="main"></main>
</div>
<nav class="tabbar" id="tabbar"></nav>
<div class="toast" id="toast"></div>
<script>
const qTab=new URLSearchParams(location.search).get('tab');
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const $=s=>document.querySelector(s);
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const ICON={
  today:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.500"/><rect x="14" y="3" width="7" height="5" rx="1.500"/><rect x="14" y="12" width="7" height="9" rx="1.500"/><rect x="3" y="16" width="7" height="5" rx="1.500"/></svg>',
  spend:'<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  sched:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2.500"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>',
  settings:'<svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>'};
const TABS=[['today','Overview'],['spend','Spending'],['sched','Schedule'],['settings','Settings']];
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2600)};
const nf=(n,d=2)=>n.toFixed(d).replace('.',',');
const eur=e=>nf(e||0)+' €';
const cents=c=>nf(c,1);
const TZ='Europe/Helsinki';
const dayKey=(d=new Date())=>d.toLocaleDateString('sv',{timeZone:TZ});
const hh=d=>d.toLocaleTimeString('fi',{hour:'2-digit',minute:'2-digit',timeZone:TZ});
const wd=d=>d.toLocaleDateString('en',{weekday:'short',timeZone:TZ});
const widget=new URLSearchParams(location.search).has('widget');
if(widget)document.body.classList.add('widget');
{const t=ls.get('theme');if(t)document.documentElement.dataset.theme=t}

/* ---------- backends: homelab server or GitHub ---------- */
const S={mode:null,base:ls.get('server')||'',srvTok:ls.get('srvtok')||'',repo:ls.get('repo')||'',ghTok:ls.get('token')||'',
  cfg:null,state:null,sha:null,tab:qTab||ls.get('tab')||'today',range:+(ls.get('range')||14),dur:+(ls.get('dur')||120),err:'',loading:true,online:false,dirty:false,tableView:false};
const b64d=b=>JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\n/g,'')),c=>c.charCodeAt(0))));
const b64e=o=>{let s='';new TextEncoder().encode(JSON.stringify(o,null,2)+'\n').forEach(c=>s+=String.fromCharCode(c));return btoa(s)};
async function srv(path,opt={}){
  const r=await fetch((S.base||'')+'/api/'+path,{...opt,headers:{'Content-Type':'application/json',...(S.srvTok?{Authorization:'Bearer '+S.srvTok}:{}),...(opt.headers||{})},cache:'no-store'});
  if(!r.ok)throw new Error(r.status===401?'Wrong server password':'Server '+r.status);return r.json();
}
async function gh(path,opt={}){
  const r=await fetch(`https://api.github.com/repos/${S.repo}/contents/${path}`,{...opt,headers:{Authorization:'Bearer '+S.ghTok,Accept:'application/vnd.github+json',...(opt.headers||{})},cache:'no-store'});
  if(!r.ok)throw new Error(r.status===404||r.status===401?'GitHub: check repository and token':'GitHub '+r.status);return r.json();
}
async function detect(){
  if(location.protocol.startsWith('http')){try{await srv('state');S.mode='server';return}catch(e){if(S.base||/Wrong/.test(e.message)){S.mode='server';throw e}}}
  S.mode=S.repo&&S.ghTok?'github':null;
}
async function load(quiet){
  try{
    if(!S.mode)await detect();
    if(S.mode==='server'){S.state=await srv('state');S.cfg=await srv('config')}
    else if(S.mode==='github'){const c=await gh('config.json');S.cfg=b64d(c.content);S.sha=c.sha;try{S.state=b64d((await gh('data/state.json')).content)}catch(e){S.state=null}}
    S.err='';S.online=!!S.mode;
  }catch(e){S.err=e.message;S.online=false;if(!/Wrong|GitHub:/.test(e.message))S.mode=null}
  S.loading=false;if(!quiet||!isEditing())render();
}
const isEditing=()=>document.activeElement&&/INPUT|SELECT/.test(document.activeElement.tagName);
let saveQ=Promise.resolve();
const saveCfg=msg=>saveQ=saveQ.then(()=>doSave(msg),()=>doSave(msg));   // one save at a time
async function doSave(msg){
  for(let i=0;i<4;i++){
    try{
      if(S.mode==='server')await srv('config',{method:'PUT',body:JSON.stringify(S.cfg)});
      else{const r=await gh('config.json',{method:'PUT',body:JSON.stringify({message:'config from ACtrack',content:b64e(S.cfg),sha:S.sha})});S.sha=r.content.sha}
      S.dirty=false;toast(msg||(S.mode==='server'?'Saved':'Saved. Applies within a few minutes'));return;
    }catch(e){
      if(S.mode==='github'&&/GitHub (409|422)/.test(e.message)&&i<3){   // file changed since we read it: take the new version id and retry
        try{S.sha=(await gh('config.json')).sha}catch(_){}
        continue}
      toast('Save failed: '+e.message);return}
  }
}
async function control(id,mode,target){
  const u=S.cfg.units[id],minutes=S.dur||43200;   // 0 = until switched back to Auto
  try{
    if(S.mode==='server'){S.state=await srv('control',{method:'POST',body:JSON.stringify({id,mode,target,minutes})});S.cfg=await srv('config')}
    else{
      if(mode==='auto')delete u.override;
      else u.override={mode,until:new Date(Date.now()+minutes*60e3).toISOString(),...(target?{target}:{})};
      await saveCfg(mode==='off'?'Turning off. The scheduler picks it up in a few minutes':mode==='on'?'Turning on. The scheduler picks it up in a few minutes':'Back to the schedule');
      S.pend=S.pend||{};S.pend[id]={ov:u.override||null,at:Date.now()};   // show it until the scheduler reports back
      [40e3,80e3,130e3].forEach(ms=>setTimeout(()=>load(true),ms));
    }
    render();
  }catch(e){toast('Failed: '+e.message)}
}

/* ---------- data ---------- */
const prices=()=>(S.state?.plan?.prices||[]).map(p=>({t:new Date(p.t),c:p.c}));
const nowIdx=ps=>{const n=Date.now();return ps.findIndex(p=>n>=p.t&&n<p.t.getTime()+3600e3)};
const devs=()=>Object.entries(S.state?.devices||{});
const heatSet=()=>{const s=new Set();devs().forEach(([,d])=>(d.plan||[]).forEach(p=>p.heat&&s.add(new Date(p.t).getTime())));return s};
const MODE={heat:'Heating',idle:'Holding low',off:'Off','hands-off':'Hands off'};
const modeLabel=x=>MODE[x.mode]||(x.on?'Heating':'Idle');
const sbLabel=v=>v<15?'Off':v+'°';
function ranges(ps,heat){
  const out=[];let cur=null;
  ps.forEach(p=>{if(p.t.getTime()+3600e3<=Date.now())return;
    if(heat.has(p.t.getTime())){if(cur&&cur.end.getTime()===p.t.getTime())cur.end=new Date(p.t.getTime()+3600e3);else{cur={start:p.t,end:new Date(p.t.getTime()+3600e3)};out.push(cur)}}});
  return out;
}
const fmtRange=r=>`${wd(r.start)} ${hh(r.start)}–${hh(r.end)}`;

/* ---------- charts ---------- */
const L=34;
function priceChart(ps,heat,id){
  if(!ps.length)return '<div class="empty">No price data yet</div>';
  const W=720,H=210,B=26,bw=(W-L)/ps.length,mx=Math.max(...ps.map(p=>p.c))*1.1,ni=nowIdx(ps);
  let s=`<svg viewBox="0 0 ${W} ${H+B}" role="img" aria-label="Spot price per hour">`;
  [0,.5,1].forEach(f=>{const y=H-H*f/1.1;s+=`<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-8}" y="${y+4}" text-anchor="end">${Math.round(mx/1.1*f)}</text>`});
  ps.forEach((p,i)=>{const h=Math.max(2,p.c/mx*H),x=L+i*bw,hot=heat.has(p.t.getTime()),past=p.t.getTime()+3600e3<Date.now();
    if(hot)s+=`<rect x="${x}" y="0" width="${bw}" height="${H}" fill="var(--band)"/><rect x="${x}" y="${H+3}" width="${bw}" height="3" fill="var(--accent)"/>`;
    s+=`<rect x="${x+1}" y="${H-h}" width="${Math.max(1.5,bw-2)}" height="${h}" rx="1" fill="var(--bar)" opacity="${past?.45:1}"/>`;
    if(p.t.getHours()===0&&i){s+=`<line x1="${x}" x2="${x}" y1="0" y2="${H}" stroke="var(--line2)" stroke-dasharray="2 3"/>`}
    if(p.t.getHours()%6===0)s+=`<text x="${x+bw/2}" y="${H+20}" text-anchor="middle">${p.t.getHours()===0?wd(p.t):String(p.t.getHours()).padStart(2,'0')}</text>`});
  if(ni>=0){const x=L+ni*bw+bw/2;s+=`<line x1="${x}" x2="${x}" y1="0" y2="${H}" stroke="var(--ink)" stroke-width="1"/>`}
  return `<div class="chart" id="${id}">${s}</svg><div class="tip"></div></div>`;
}
function wirePriceChart(id,ps,heat){
  const el=$('#'+id);if(!el)return;const tip=el.querySelector('.tip'),svg=el.querySelector('svg');
  el.addEventListener('pointermove',e=>{const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*720,i=Math.floor((x-L)/((720-L)/ps.length));if(i<0||i>=ps.length){tip.style.opacity=0;return}
    const p=ps[i];tip.innerHTML=`<span class="t2">${wd(p.t)} ${hh(p.t)}</span><br><b>${cents(p.c)} c/kWh</b>${heat.has(p.t.getTime())?' <span class="t2">· heating</span>':''}`;
    tip.style.left=Math.min(r.width-60,Math.max(60,(L+(i+.5)*(720-L)/ps.length)/720*r.width))+'px';tip.style.top=(e.clientY-r.top-14)+'px';tip.style.opacity=1});
  el.addEventListener('pointerleave',()=>tip.style.opacity=0);
}

/* ---------- views ---------- */
const connectPanel=()=>`<div class="panel"><div class="empty">Not connected. <a href="#" data-go="settings">Open settings</a> to connect your server or GitHub repository.</div></div>`;
const head=(t,m,right='')=>`<div class="head"><div><h1>${t}</h1><div class="meta">${m}</div></div>${right}</div>`;
const DURS=[[60,'for 1 hour'],[120,'for 2 hours'],[240,'for 4 hours'],[0,'until I press Auto']];
function manualNote(ov){
  if(!ov)return 'Following the schedule';
  const far=new Date(ov.until)-Date.now()>2*864e5;
  return `Manual ${ov.mode==='off'?'off':'on'} ${far?'until you press Auto':'until '+hh(new Date(ov.until))}`;
}
function viewToday(){
  if(!S.online&&!S.state)return head('Overview',S.err||'Not connected')+connectPanel();
  const ps=prices(),ni=nowIdx(ps),cur=ni>=0?ps[ni].c:null,heat=heatSet(),d=devs();
  let h=head('Overview',S.state?.updated?'Updated '+hh(new Date(S.state.updated))+' · prices include estimated margin and transfer':'Waiting for the first scheduler run',`<div style="display:flex;gap:14px;align-items:center"><label style="display:flex;gap:8px;align-items:center;color:var(--ink2);font-weight:500">Automation<button class="switch ${S.cfg?.paused?'':'on'}" data-pause aria-label="Automation on or off" aria-pressed="${!S.cfg?.paused}"></button></label><button class="btn ghost sm" data-refresh>Refresh</button></div>`);
  if(S.cfg?.paused)h+=`<div class="panel"><div class="tool" style="border-top:0"><span><b style="font-weight:600">Automation is paused.</b> <span class="sub">ACtrack is not changing your ACs. It still records energy and cost.</span></span><button class="btn sm" data-pause>Resume</button></div></div>`;
  if(!d.length)h+=`<div class="panel"><div class="empty">No AC tracked yet. Add one in <a href="#" data-go="sched">Schedule</a>.</div></div>`;
  d.forEach(([id,x])=>{const day=x.days?.[dayKey()]||{kwh:0,eur:0};
    let raw=x.override,applying=false;const pd=S.pend?.[id];
    if(pd){if(new Date(S.state.updated).getTime()<pd.at){raw=pd.ov;applying=true}else delete S.pend[id]}
    const ov=raw&&new Date(raw.until)>new Date()?raw:null;
    h+=`<div class="panel"><div class="ph"><b>${x.name||id}</b><span class="badge ${x.mode==='heat'?'on':''}"><i></i>${modeLabel(x)}</span></div>
    <div class="stats"><div class="stat"><div class="k">Room</div><div class="v">${x.room_temp!=null?nf(x.room_temp,1):'–'}<small>°C</small></div></div>
    <div class="stat"><div class="k">Target</div><div class="v">${nf(x.target,1)}<small>°C</small><span class="stepper"><button data-t="-0.5" data-id="${id}" aria-label="Lower target">−</button><button data-t="0.5" data-id="${id}" aria-label="Raise target">+</button></span></div></div>
    <div class="stat"><div class="k">Outside</div><div class="v">${x.outside_temp!=null?nf(x.outside_temp,0):'–'}<small>°C</small></div></div>
    <div class="stat"><div class="k">Today</div><div class="v">${eur(day.eur)}</div><div class="sub">${nf(day.kwh,1)} kWh</div></div></div>
    <div class="tool"><div class="grp"><div class="seg" data-ctl="${id}"><button class="${!ov?'on':''}" data-m="auto">Auto</button><button class="${ov&&ov.mode==='on'?'on':''}" data-m="on">On</button><button class="${ov&&ov.mode==='off'?'on':''}" data-m="off">Off</button></div>
    <select id="dur" aria-label="How long a manual On or Off lasts">${DURS.map(([v,l])=>`<option value="${v}" ${S.dur===v?'selected':''}>${l}</option>`).join('')}</select></div>
    <span class="sub" style="margin:0">${applying?'Applying, the AC updates within a couple of minutes. ':''}${manualNote(ov)}</span></div></div>`});
  const rg=ranges(ps,heat).slice(0,5);
  h+=`<div class="panel"><div class="ph"><div><span class="k" style="margin:0">Spot price now</span> <b style="font-size:18px;margin-left:8px">${cur==null?'–':cents(cur)}</b> <span class="sub">c/kWh</span></div><div class="legend"><span><i style="background:var(--band);outline:1px solid var(--accent);outline-offset:-1px"></i>Heating hours</span><span><i style="background:var(--bar)"></i>Spot price</span></div></div>
  <div class="pb">${priceChart(ps,heat,'pc')}${rg.length?`<div class="plan"><b>Planned heating</b> &nbsp;${rg.map(fmtRange).join(' &nbsp;·&nbsp; ')}</div>`:'<div class="plan">No heating planned in the known price window.</div>'}</div></div>`;
  const adv=d.find(([,x])=>x.advice)?.[1].advice;
  if(adv){const best=Math.min(...adv.rows.map(r=>r.eur));
    h+=`<div class="panel"><div class="ph"><b>Strategy estimate</b><span class="sub" style="margin:0">Next ${adv.hours} h · generic room model, not measured from yours</span></div>
    <table><tr><th>Strategy</th><th>Cost</th><th>kWh</th><th>Coldest</th></tr>${adv.rows.map(r=>`<tr><td>${r.name}</td><td class="${r.eur===best?'best':''}">${eur(r.eur)}</td><td>${nf(r.kwh,1)}</td><td>${r.min_temp??'–'}°</td></tr>`).join('')}</table></div>`}
  return h;
}
function viewSpend(){
  const d=devs();if(!d.length)return head('Spending','Nothing tracked yet');
  const byDay={};d.forEach(([,x])=>Object.entries(x.days||{}).forEach(([k,v])=>{(byDay[k]??={eur:0,kwh:0});byDay[k].eur+=v.eur;byDay[k].kwh+=v.kwh}));
  const keys=Object.keys(byDay).sort().slice(-S.range),tot=keys.reduce((a,k)=>a+byDay[k].eur,0),kwh=keys.reduce((a,k)=>a+byDay[k].kwh,0);
  const byHour=Array(24).fill(0);d.forEach(([,x])=>keys.forEach(k=>Object.entries(x.days?.[k]?.hours||{}).forEach(([hr,v])=>byHour[+hr]+=v.eur)));
  let h=head('Spending','Measured kWh × hourly spot price',`<div class="seg">${[7,14,30].map(n=>`<button class="${S.range===n?'on':''}" data-r="${n}">${n} days</button>`).join('')}</div>`);
  h+=`<div class="panel"><div class="stats"><div class="stat"><div class="k">Total</div><div class="v">${eur(tot)}</div></div><div class="stat"><div class="k">Per day</div><div class="v">${keys.length?eur(tot/keys.length):'–'}</div></div><div class="stat"><div class="k">Energy</div><div class="v">${nf(kwh,1)}<small>kWh</small></div></div><div class="stat"><div class="k">Average price</div><div class="v">${kwh?cents(tot/kwh*100):'–'}<small>c/kWh</small></div></div></div></div>`;
  h+=`<div class="panel"><div class="ph"><b>Cost per day</b><div class="seg"><button class="${!S.tableView?'on':''}" data-tv="0">Chart</button><button class="${S.tableView?'on':''}" data-tv="1">Table</button></div></div>`;
  if(S.tableView)h+=`<table><tr><th>Day</th><th>kWh</th><th>Cost</th></tr>${keys.slice().reverse().map(k=>`<tr><td>${k}</td><td>${nf(byDay[k].kwh,1)}</td><td>${eur(byDay[k].eur)}</td></tr>`).join('')}</table></div>`;
  else{const W=720,H=170,mx=Math.max(.01,...keys.map(k=>byDay[k].eur))*1.1,bw=(W-L)/Math.max(keys.length,1);
    h+=`<div class="pb"><div class="chart" id="sc"><svg viewBox="0 0 ${W} ${H+22}">`+[0,.5,1].map(f=>{const y=H-H*f/1.1;return `<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-8}" y="${y+4}" text-anchor="end">${nf(mx/1.1*f,1)}</text>`}).join('')+keys.map((k,i)=>{const v=byDay[k].eur,hgt=Math.max(1.5,v/mx*H);return `<rect data-k="${k}" x="${L+i*bw+bw*.15}" y="${H-hgt}" width="${bw*.7}" height="${hgt}" rx="2" fill="var(--bar2)"/><text x="${L+i*bw+bw/2}" y="${H+15}" text-anchor="middle">${keys.length>16&&i%2?'':k.slice(8)}</text>`}).join('')+`</svg><div class="tip"></div></div></div></div>`}
  h+=`<div class="panel"><div class="ph"><b>By hour of day</b><span class="sub" style="margin:0">When the money goes</span></div><div class="pb">${hourBars(byHour)}</div></div>`;
  h+=`<div class="panel"><table><tr><th>AC</th><th>kWh</th><th>Cost</th></tr>${d.map(([id,x])=>{const e=keys.reduce((a,k)=>a+(x.days?.[k]?.eur||0),0),w=keys.reduce((a,k)=>a+(x.days?.[k]?.kwh||0),0);return `<tr><td>${x.name||id}</td><td>${nf(w,1)}</td><td>${eur(e)}</td></tr>`}).join('')}</table></div>`;
  return h+'<p class="sub">Panasonic reports energy with a delay, so figures are approximate.</p>';
}
function hourBars(v){const mx=Math.max(.001,...v),W=720,H=60,bw=(W-L)/24;return `<div class="chart"><svg viewBox="0 0 ${W} ${H+18}">`+v.map((x,i)=>`<rect x="${L+i*bw+2}" y="${H-Math.max(1.5,x/mx*H)}" width="${bw-4}" height="${Math.max(1.5,x/mx*H)}" rx="1.500" fill="${x?'var(--bar2)':'var(--line)'}"><title>${String(i).padStart(2,'0')}:00 · ${eur(x)}</title></rect>${i%3===0?`<text x="${L+i*bw+bw/2}" y="${H+14}" text-anchor="middle">${String(i).padStart(2,'0')}</text>`:''}`).join('')+'</svg></div>'}
const hourSel=(v,k,e)=>`<select data-k="${k}" aria-label="${k}">${Array.from({length:24+e},(_,i)=>{const t=String(i).padStart(2,'0')+':00';return `<option ${t===v?'selected':''}>${t}</option>`}).join('')}</select>`;
const slider=(lbl,sub,k,u,min,max,step,def,fmt)=>`<div class="row"><div class="l"><b>${lbl}</b><span>${sub}</span></div><div class="c"><input type="range" min="${min}" max="${max}" step="${step}" value="${u[k]??def}" data-k="${k}"><output>${fmt(u[k]??def)}</output></div></div>`;
function viewSched(){
  if(!S.cfg)return head('Schedule','Not connected')+connectPanel();
  let h=head('Schedule','Choose when it should be warm. It heats in the cheapest hours inside each window.',`<button class="btn ${S.dirty?'':'dim'}" id="save">Save changes</button>`);
  Object.entries(S.cfg.units).forEach(([id,u])=>{
    const nm=S.state?.devices?.[id]?.name||S.state?.available?.find(a=>a.id===id)?.name||id;
    h+=`<div class="panel" data-u="${id}"><div class="ph"><b>${nm}</b><div style="display:flex;gap:12px;align-items:center"><span class="sub" style="margin:0">${u.enabled!==false?'Enabled':'Paused'}</span><button class="switch ${u.enabled!==false?'on':''}" data-k="enabled" aria-label="Enabled"></button></div></div>
    ${slider('Target temperature','Room setpoint while heating','target',u,16,26,.5,21,v=>nf(v,1)+'°')}
    ${slider('Comfort','Share of each window that is heated, cheapest hours first','comfort',u,.2,1,.05,.7,v=>Math.round(v*100)+'%')}
    ${slider('Price ceiling','Never heat above this price','max_price',u,5,80,1,40,v=>v+' c')}
    ${slider('Between heating hours','Idle setpoint, keeps the AC on instead of cycling it off','setback',u,14,22,1,18,sbLabel)}
    <div class="ph" style="border-top:1px solid var(--line);border-bottom:0"><b>Warm during</b><button class="btn ghost sm" data-addw>Add window</button></div>
    ${(u.windows||[]).map((w,i)=>`<div class="win" data-w="${i}"><div class="days">${DAYS.map((n,j)=>`<button class="${w.days.includes(j)?'on':''}" data-d="${j}">${n}</button>`).join('')}</div>${hourSel(w.start,'start',0)}<span class="arrow">to</span>${hourSel(w.end,'end',1)}<button class="btn ghost sm" data-rm="${i}" aria-label="Remove window">Remove</button></div>`).join('')}
    <div class="tool"><span class="sub" style="margin:0">Stops tracking this AC and leaves it as it is.</span><button class="btn ghost sm" data-delu>Stop tracking</button></div></div>`});
  const free=(S.state?.available||[]).filter(a=>!S.cfg.units[a.id]);
  if(free.length)h+=`<div class="panel"><div class="ph"><b>Available ACs</b></div>${free.map(a=>`<div class="row"><div class="l"><b>${a.name}</b></div><button class="btn sm" data-add="${a.id}">Track</button></div>`).join('')}</div>`;
  return h;
}
function viewSettings(){
  return head('Settings','Where ACtrack gets its data')+`
  <div class="grid2"><div class="panel"><div class="ph"><b>Homelab server</b><span class="badge ${S.mode==='server'&&S.online?'on':''}"><i></i>${S.mode==='server'&&S.online?'Connected':'Not used'}</span></div><div class="pb">
  <div class="k">Address</div><input type="text" id="srv" value="${S.base}" placeholder="http://homelab:8787"><div class="k" style="margin-top:12px">Password</div><input type="password" id="srvtok" value="${S.srvTok}">
  <p class="sub">Direct control without GitHub. Leave the address empty when this page is served by the server itself.</p></div></div>
  <div class="panel"><div class="ph"><b>GitHub</b><span class="badge ${S.mode==='github'&&S.online?'on':''}"><i></i>${S.mode==='github'&&S.online?'Connected':'Not used'}</span></div><div class="pb">
  <div class="k">Repository</div><input type="text" id="repo" value="${S.repo}" placeholder="owner/actrack"><div class="k" style="margin-top:12px">Token</div><input type="password" id="ghtok" value="${S.ghTok}">
  <p class="sub">Fine-grained token for that one repository with Contents: read and write. Stored only in this browser.</p></div></div></div>
  <div class="panel" style="margin-top:16px"><div class="row"><div class="l"><b>Appearance</b><span>Follows your system by default</span></div><div class="seg">${['auto','light','dark'].map(t=>`<button class="${(ls.get('theme')||'auto')===t?'on':''}" data-th="${t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div></div></div>
  <div style="display:flex;gap:14px;align-items:center;justify-content:flex-end"><span class="err">${S.err||''}</span><button class="btn" id="conn">Connect</button></div>
  <p class="sub" style="margin-top:18px">Keys 1 to 4 switch views, R refreshes. Add <code>?widget=1</code> to the address for the compact card.</p>`;
}
function viewWidget(){
  const ps=prices(),ni=nowIdx(ps),d=devs(),e=d.reduce((a,[,x])=>a+(x.days?.[dayKey()]?.eur||0),0);
  return `<div class="panel"><div class="stats" style="grid-template-columns:1fr 1fr"><div class="stat"><div class="k">Price now</div><div class="v">${ni>=0?cents(ps[ni].c):'–'}<small>c</small></div></div><div class="stat"><div class="k">Today</div><div class="v">${eur(e)}</div></div></div>
  ${d.map(([,x])=>`<div class="tool"><span>${x.name}<span class="sub"> · ${x.room_temp??'–'}°</span></span><span class="badge ${x.mode==='heat'?'on':''}"><i></i>${modeLabel(x)}</span></div>`).join('')}</div>`;
}

/* ---------- render + events ---------- */
function render(){
  const main=$('#main');
  $('#side').innerHTML=`<div class="brand"><img src="icon.svg?v=3" alt="">ACtrack</div>`+
    TABS.map(([k,n])=>`<button class="nav ${S.tab===k?'on':''}" data-go="${k}">${ICON[k]}${n}</button>`).join('')+
    `<div class="side-foot"><span class="dot ${S.online?'ok':'bad'}"></span>${S.online?(S.mode==='server'?'Connected to server':'Connected to GitHub'):'Not connected'}</div>`;
  $('#tabbar').innerHTML=TABS.map(([k,n])=>`<button class="${S.tab===k?'on':''}" data-go="${k}">${ICON[k]}${n}</button>`).join('');
  if(widget){main.innerHTML=S.state?viewWidget():'<div class="panel"><div class="empty">Open ACtrack and connect first</div></div>';return}
  if(S.loading){main.innerHTML='<div class="panel"><div class="empty">Loading</div></div>';return}
  main.innerHTML=({today:viewToday,spend:viewSpend,sched:viewSched,settings:viewSettings}[S.tab]||viewToday)();
  if(S.tab==='today')wirePriceChart('pc',prices(),heatSet());
  if(S.tab==='spend'){const el=$('#sc');if(el){const tip=el.querySelector('.tip');el.querySelectorAll('rect').forEach(r=>{r.addEventListener('pointerenter',()=>{const k=r.dataset.k,by={eur:0,kwh:0};devs().forEach(([,x])=>{const v=x.days?.[k];if(v){by.eur+=v.eur;by.kwh+=v.kwh}});const b=el.getBoundingClientRect(),rb=r.getBoundingClientRect();tip.innerHTML=`<span class="t2">${k}</span><br><b>${eur(by.eur)}</b> <span class="t2">· ${nf(by.kwh,1)} kWh</span>`;tip.style.left=rb.left-b.left+rb.width/2+'px';tip.style.top=rb.top-b.top-6+'px';tip.style.opacity=1});r.addEventListener('pointerleave',()=>tip.style.opacity=0)})}}
}
const go=t=>{S.tab=t;ls.set('tab',t);render();scrollTo(0,0)};
document.addEventListener('click',async e=>{
  const t=e.target.closest('button,a');if(!t)return;
  if(t.dataset.go){e.preventDefault();return go(t.dataset.go)}
  if(t.dataset.refresh!==undefined){load();return toast('Refreshing')}
  if(t.dataset.pause!==undefined){S.cfg.paused=!S.cfg.paused;await saveCfg(S.cfg.paused?'Paused. ACtrack will leave your ACs alone':'Resumed. Back to the schedule');return render()}
  if(t.dataset.r){S.range=+t.dataset.r;ls.set('range',S.range);return render()}
  if(t.dataset.tv){S.tableView=t.dataset.tv==='1';return render()}
  if(t.dataset.th){const v=t.dataset.th;ls.set('theme',v==='auto'?'':v);if(v==='auto')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=v;return render()}
  if(t.id==='conn'){S.base=$('#srv').value.trim().replace(/\/$/,'');S.srvTok=$('#srvtok').value;S.repo=$('#repo').value.trim();S.ghTok=$('#ghtok').value.trim();
    ['server','srvtok','repo','token'].forEach((k,i)=>ls.set(k,[S.base,S.srvTok,S.repo,S.ghTok][i]));S.mode=null;S.loading=true;render();await load();
    if(S.online){toast('Connected');go('today')}else{toast(S.err||'Could not connect. Fill in repository and token');render()}return}
  if(t.id==='save')return saveCfg();
  const ctl=t.closest('[data-ctl]');if(ctl&&t.dataset.m)return control(ctl.dataset.ctl,t.dataset.m,t.dataset.m==='on'?S.cfg.units[ctl.dataset.ctl]?.target:undefined);
  if(t.dataset.t){const id=t.dataset.id,u=S.cfg.units[id],x=S.state.devices[id],nt=Math.max(16,Math.min(28,(u.target??21)+ +t.dataset.t));u.target=nt;x.target=nt;S.dirty=true;render();clearTimeout(go.d);go.d=setTimeout(async()=>{await saveCfg(S.mode==='server'?'Target '+nt+'°':undefined);if(S.mode==='server')control(id,'auto')},700);return}
  if(t.dataset.add){S.cfg.units[t.dataset.add]={enabled:true,target:21,comfort:.7,max_price:40,setback:18,windows:[{days:[0,1,2,3,4,5,6],start:'06:00',end:'16:00'}]};S.dirty=true;return render()}
  const card=t.closest('[data-u]');if(!card)return;const u=S.cfg.units[card.dataset.u];
  if(t.dataset.d!==undefined){const w=u.windows[+t.closest('[data-w]').dataset.w],d=+t.dataset.d;w.days=w.days.includes(d)?w.days.filter(x=>x!==d):[...w.days,d].sort()}
  else if(t.dataset.rm!==undefined)u.windows.splice(+t.dataset.rm,1);
  else if(t.dataset.addw!==undefined)(u.windows=u.windows||[]).push({days:[0,1,2,3,4,5,6],start:'06:00',end:'12:00'});
  else if(t.dataset.delu!==undefined)delete S.cfg.units[card.dataset.u];
  else if(t.dataset.k==='enabled')u.enabled=u.enabled===false;
  else return;
  S.dirty=true;render();
});
document.addEventListener('change',e=>{
  if(e.target.id==='dur'){S.dur=+e.target.value;ls.set('dur',S.dur);return}
  if(e.target.tagName==='SELECT')e.target.dispatchEvent(new Event('input',{bubbles:true}))});
document.addEventListener('input',e=>{
  const t=e.target,card=t.closest('[data-u]');if(!card||!t.dataset.k)return;const u=S.cfg.units[card.dataset.u],w=t.closest('[data-w]'),k=t.dataset.k;
  if(w)u.windows[+w.dataset.w][k]=t.value;else u[k]=+t.value;S.dirty=true;$('#save')?.classList.remove('dim');
  const o=t.closest('.row')?.querySelector('output');if(o)o.textContent=k==='target'?nf(u[k],1)+'°':k==='comfort'?Math.round(u[k]*100)+'%':k==='setback'?sbLabel(u[k]):u[k]+' c';
});
document.addEventListener('keydown',e=>{if(/INPUT|SELECT/.test(e.target.tagName)||e.metaKey||e.ctrlKey)return;const i='1234'.indexOf(e.key);if(i>=0)go(TABS[i][0]);if(e.key==='r'){load();toast('Refreshing')}});
render();load();setInterval(()=>load(true),60e3);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
